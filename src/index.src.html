            background-color: #f0fdf4;

            user-select: none;
            overflow-x: hidden;
            transition: background-color 0.35s ease, color 0.35s ease;
        }
        
        /* تنسيق خلفية الوضع الليلي */
        html.dark body {
            background-color: #020617;
            background-image: radial-gradient(#064e3b 0.9px, transparent 0.9px);

        /* شريط تمرير مخصص أنيق */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* شاشة البداية المتحركة (Splash Screen) */
        #splashScreen {
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .splash-hide {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        /* حركات انتقالية وتفاعلية احترافية */
        .fade-in-up {
            animation: fadeInUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* حركة انتقال المحتوى الرئيسي عند تغيير التبويبات */
        .view-transition-enter {
            animation: viewSlideIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes viewSlideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); filter: blur(2px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .stagger-1 { animation-delay: 0.04s; }
        .stagger-2 { animation-delay: 0.09s; }
        .stagger-3 { animation-delay: 0.14s; }
        .stagger-4 { animation-delay: 0.19s; }
        .stagger-5 { animation-delay: 0.24s; }

        /* حركة الطفو للعناصر المميزة */
        .float-anim {
            animation: floatAnim 3.5s ease-in-out infinite;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        /* تأثير اللمعان على الأزرار الذهبية */
        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shimmerMove 3s infinite;
        }
        @keyframes shimmerMove {
            0% { left: -60%; }
            40%, 100% { left: 130%; }
        }

        /* تأثير الضغط الفيزيائي للأزرار والبطاقات */
        .interactive-card {
            transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.24s ease, border-color 0.24s ease, background-color 0.2s ease;
        }
        .interactive-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px -8px rgba(6, 78, 59, 0.18);
        }
        .interactive-card:active {
            transform: scale(0.965);
        }

        /* تأثير تموج الضغط (Ripple Effect) */
        .ripple-host {
            position: relative;
            overflow: hidden;
        }
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(251, 191, 36, 0.35);
            transform: scale(0);
            animation: rippleAnim 0.55s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* مؤشر التبويب النشط في الشريط السفلي */
        .nav-item {
            position: relative;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-item i {
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-item.active-tab i {
            transform: translateY(-2px) scale(1.15);
        }

        /* انتقال سلس لطي وفتح تفاصيل الأحداث */
        .accordion-content {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
            opacity: 1;
        }
        .accordion-content.collapsed {
            grid-template-rows: 0fr;
            opacity: 0;
        }
        .accordion-inner {
            overflow: hidden;
        }

        /* احتفال النجاح عند الإجابة الصحيحة */
        .confetti-piece {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 60;
            animation: confettiFall 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes confettiFall {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(540deg) scale(0.4); opacity: 0; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.12s; }
        .stagger-3 { animation-delay: 0.19s; }
        .stagger-4 { animation-delay: 0.26s; }
        .stagger-5 { animation-delay: 0.33s; }

        /* حركة الطفو للعناصر المميزة */
        .float-anim {
            animation: floatAnim 3.5s ease-in-out infinite;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        /* تأثير اللمعان على الأزرار الذهبية */
        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shimmerMove 3s infinite;
        }
        @keyframes shimmerMove {
            0% { left: -60%; }
            40%, 100% { left: 130%; }
        }

        /* تأثير الضغط الفيزيائي للأزرار والبطاقات */
        .interactive-card {
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease;
        }
        .interactive-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px rgba(6, 78, 59, 0.15);
        }
        .interactive-card:active {
            transform: scale(0.97);
        }

        .pulse-btn {
            animation: pulseShadow 2s infinite;
        }
        @keyframes pulseShadow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* زخرفة إسلامية هندسية للبطاقة الرئيسية */
        .islamic-hero {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            position: relative;
        }
        .islamic-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#34d399 1px, transparent 1px);
            background-size: 22px 22px;
            opacity: 0.15;
        }

        /* تأثيرات تفاعلية داخل الرسوم التوضيحية SVG */
        .svg-hotspot {
            cursor: pointer;
            transition: transform 0.25s ease, filter 0.25s ease;
            transform-origin: center;
        }
        .svg-hotspot:hover {
            filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.9));
        }

        /* حركة نبض لطيفة للشعار المخصص */
        .logo-glow {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
        }

        /* ===== هوية بصرية جديدة (مرجع التصميم) ===== */
        :root { --gold:#f5b324; --gold-soft:#fde68a; --green-d:#064e3b; --green-dd:#022c22; --cream:#fbf6e6; }
        body { background-color: var(--cream);
               background-image: radial-gradient(rgba(6,78,59,.10) 1px, transparent 1px); background-size: 26px 26px; }
        html.dark body { background-color:#04120d; background-image: radial-gradient(rgba(52,211,153,.12) 1px, transparent 1px); }
        header.app-header { padding-top: env(safe-area-inset-top); background: linear-gradient(180deg,#0a6a4f 0%,#064e3b 100%) !important; }
        html.dark header.app-header { background: linear-gradient(180deg,#0b2a21 0%,#04120d 100%) !important; }
        main#appContainer { padding-bottom: calc(7.5rem + env(safe-area-inset-bottom)); }

        /* شريط التنقل السفلي الأخضر مع تبويب ذهبي نشط */
        nav.app-nav { left:0 !important; right:0 !important; bottom:0 !important; transform:none !important; width:100% !important;
            border-radius: 22px 22px 0 0 !important; background: linear-gradient(180deg,#0a6a4f,#064e3b) !important;

        @media (min-width:640px){ nav.app-nav{ left:50% !important; transform:translateX(-50%) !important; width:480px !important; } }

        /* شاشة البداية: قوس وفوانيس */
        #splashScreen { background: radial-gradient(ellipse at 50% 28%, #0f7a58 0%, #064e3b 45%, #022c22 100%); overflow:hidden; }
        .lantern-swing { transform-origin: 50% 0; animation: swing 4s ease-in-out infinite; }
        .lantern-swing.l2 { animation-delay: -2s; }
        @keyframes swing { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
        .gold-title { background: linear-gradient(180deg,#fff3b0,#f5b324 55%,#b45309); -webkit-background-clip:text; background-clip:text; color:transparent; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
        .orn-divider { display:flex; align-items:center; gap:10px; width:220px; margin:10px auto 14px; color:#f5b324; }
        .orn-divider::before,.orn-divider::after { content:''; flex:1; height:1.5px; background:linear-gradient(90deg,transparent,#f5b324); }
        .orn-divider::after { transform: scaleX(-1); }

        /* بطاقة الهيرو على الصفحة الرئيسية بخلفية مدينة */
        .hero-card { background: linear-gradient(180deg,#fff8dc 0%, #f7e7b0 55%, #e9d08a 100%); border:2px solid #e2b64a; border-radius:28px; overflow:hidden; position:relative; box-shadow:0 14px 30px -12px rgba(120,80,10,.35); }
        html.dark .hero-card { background: linear-gradient(180deg,#0b2a21,#063b2d 60%,#04261c); border-color:#8a6a1c; }
        .hero-badge { background: linear-gradient(180deg,#0a6a4f,#064e3b); border:2px solid #f5b324; color:#fde68a; border-radius:999px; }
        .btn-gold { background: linear-gradient(180deg,#fcd34d,#f5b324); color:#022c22; border:1.5px solid #b7791f; box-shadow:0 4px 0 #b7791f, 0 10px 18px -6px rgba(180,120,20,.5); }
        .btn-gold:active { transform: translateY(2px); box-shadow:0 2px 0 #b7791f; }
        .btn-green { background: linear-gradient(180deg,#0f8a63,#064e3b); color:#fff; border:1.5px solid #f5b324; box-shadow:0 4px 0 #022c22, 0 10px 18px -6px rgba(2,44,34,.5); }
        .btn-green:active { transform: translateY(2px); box-shadow:0 2px 0 #022c22; }

        /* بطاقات العصور بصور مصغرة وخط ذهبي */
        .era-thumb { width:64px; height:64px; border-radius:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; border:2px solid rgba(245,179,36,.7); box-shadow: inset 0 0 18px rgba(0,0,0,.35); }
        .era-thumb svg { position:absolute; inset:0; width:100%; height:100%; }
        .era-line { position:relative; }
        .era-line::before { content:''; position:absolute; top:12px; bottom:12px; right:7px; width:3px; border-radius:3px; background: linear-gradient(180deg,#f5b324,#d99a14); }
        .era-dot { position:absolute; left:0; top:50%; width:17px; height:17px; margin-top:-8px; border-radius:50%; background:#f5b324; border:3px solid #fff7d6; box-shadow:0 0 0 2px #d99a14; }
        html.dark .era-dot { border-color:#04120d; }

        /* تبويب الألعاب: شريط تقدم سميك */
        .act-progress { height:12px; border-radius:99px; background:#d9e8df; overflow:hidden; }
        html.dark .act-progress { background:#0b2a21; }
        .act-progress > div { height:100%; background: linear-gradient(90deg,#0f8a63,#34d399); border-radius:99px; transition: width .5s ease; }
        #feedbackModal > div { max-height: 92vh; overflow-y:auto; }
    </style>
</head>

        // --- نظام الوضع الليلي (Dark Mode) ---
        let isDarkMode = false;
        function initDarkMode() {
            const savedTheme = localStorage.getItem('history_app_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setDarkMode(true);
            }
        }
        function toggleDarkMode() {
            playSound('click');
            setDarkMode(!isDarkMode);
        }
        function setDarkMode(enable) {
            isDarkMode = enable;
            const htmlEl = document.documentElement;
            const icon = document.getElementById('darkModeIcon');
            if (enable) {
                htmlEl.classList.add('dark');
                if (icon) icon.className = 'fa-solid fa-sun text-amber-300';
                localStorage.setItem('history_app_theme', 'dark');
            } else {
                htmlEl.classList.remove('dark');
                if (icon) icon.className = 'fa-solid fa-moon text-amber-300';
                localStorage.setItem('history_app_theme', 'light');
            }
        }

        // --- 1. نظام المؤثرات الصوتية المدمج (Tone.js) ---
        let soundEnabled = true;
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            icon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-rose-300';
            if (soundEnabled) playSound('click');
        }

        function playSound(type) {
            if (!soundEnabled || typeof Tone === 'undefined') return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                window._synth = window._synth || new Tone.Synth().toDestination();
                const synth = window._synth;
                if (type === 'success') {
                    synth.triggerAttackRelease("C5", "16n");
                    setTimeout(() => synth.triggerAttackRelease("E5", "16n"), 100);
                    setTimeout(() => synth.triggerAttackRelease("G5", "16n"), 200);
                    setTimeout(() => synth.triggerAttackRelease("C6", "4n"), 300);
                } else if (type === 'error') {
                    synth.triggerAttackRelease("E3", "8n");
                    setTimeout(() => synth.triggerAttackRelease("C3", "4n"), 140);
                } else if (type === 'click') {
                    synth.triggerAttackRelease("G4", "32n");
                } else if (type === 'pop') {
                    synth.triggerAttackRelease("B4", "32n");
                }
            } catch (e) { console.log("Audio bypassed"); }
        }

        // --- إظهار إشعار تفاعلي عند الضغط على الرسوم التوضيحية ---
        let toastTimer = null;
        function showInteractiveTip(title, body) {
            playSound('pop');
            const toast = document.getElementById('interactiveToast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastBody').textContent = body;
            
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('-translate-y-4', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            }, 10);

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3500);
        }

                            <span class="text-2xl font-black text-emerald-700 dark:text-emerald-400 leading-none">${progressPct}%</span>
                            <div class="act-progress w-full"><div style="width:${progressPct}%"></div></div>
                        </div>
                    </div>

                    <!-- فهرس العصور بالترتيب التاريخي -->
                    <div class="fade-in-up stagger-2">
                        <div class="flex items-center justify-between mb-3 px-1">
                            <h3 class="font-black text-base sm:text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <i class="fa-solid fa-layer-group text-emerald-600 dark:text-emerald-400"></i>
                                <span>العصور مرتبة زمنياً</span>
                            </h3>
                            <span class="text-xs font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-950 px-2.5 py-1 rounded-full">${historicalEras.length} مراحل</span>
                        </div>

                        <div class="era-line grid grid-cols-1 gap-3.5 pr-7">
                            ${historicalEras.map((era, index) => `
                                <div class="relative">
                                    <span class="era-dot" style="left:auto; right:-28px"></span>
                                    <div onclick="navigateTo('timeline', '${era.id}')" class="interactive-card fade-in-up stagger-${index + 1} bg-white dark:bg-slate-900 rounded-2xl p-3 border border-amber-200/80 dark:border-slate-800 hover:border-emerald-500 cursor-pointer flex items-center gap-3 transition-colors">
                                        <div class="era-thumb">${eraThumb(era.id)}</div>
                                        <div class="flex-1 min-w-0">
                                            <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg bg-amber-100 dark:bg-slate-800 text-amber-900 dark:text-amber-200 inline-block">${era.period}</span>
                                            <h4 class="font-black text-sm sm:text-base text-slate-800 dark:text-slate-100 mt-1">${era.title}</h4>
                                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-2 leading-relaxed">${era.summary}</p>
                                        </div>
                                        <i class="fa-solid fa-chevron-left text-slate-300 dark:text-slate-600"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // تصفية الأحداث في الخط الزمني
        function handleSearchEvents(val) {
            state.searchQuery = val.trim();
            render();
            const input = document.getElementById('eraSearchInput');
            if (input) {
                input.focus();
                input.setSelectionRange(val.length, val.length);
            }
        }

        // طي أو فتح تفاصيل الحدث بتفاعل سلس بدون إعادة رسم الصفحة بالكامل
        function toggleEventDetail(key) {
            playSound('click');
            const isCurrentlyCollapsed = state.expandedEvents[key] === false;
            state.expandedEvents[key] = isCurrentlyCollapsed;
            
            const contentEl = document.getElementById(`event-desc-${key}`);
            const iconEl = document.getElementById(`event-icon-${key}`);
            if (contentEl && iconEl) {
                if (isCurrentlyCollapsed) {
                    contentEl.classList.remove('collapsed');
                    iconEl.classList.remove('rotate-180');
                } else {
                    contentEl.classList.add('collapsed');
                    iconEl.classList.add('rotate-180');
                }
            } else {
                render();
            }
        }

        // الشاشة 2: الخط الزمني التفصيلي
        function renderTimeline() {
            const era = historicalEras.find(e => e.id === state.selectedEraId) || historicalEras[0];
            const filteredEvents = era.events.filter(ev => 
                ev.title.includes(state.searchQuery) || 
                ev.desc.includes(state.searchQuery) || 
                ev.date.includes(state.searchQuery)
            );
            
            return `
                <div class="fade-in-up space-y-5">
                    <!-- شريط التنقل الأفقي بين العصور بالترتيب -->
                    <div class="flex gap-2 overflow-x-auto pb-1.5 pt-0.5 px-0.5 no-scrollbar scroll-smooth">
                        ${historicalEras.map(item => `
                            <button id="era-chip-${item.id}" onclick="navigateTo('timeline', '${item.id}')" 
                                class="ripple-host px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap transition-all duration-300 active:scale-95 flex items-center gap-2 ${item.id === era.id ? 'bg-emerald-800 dark:bg-emerald-700 text-white shadow-lg scale-[1.03] ring-2 ring-amber-400/50' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-emerald-50 dark:hover:bg-slate-800'}">
                                <span class="w-5 h-5 rounded-full transition-colors ${item.id === era.id ? 'bg-amber-400 text-emerald-950' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200'} flex items-center justify-center text-[11px] font-black">${item.order}</span>
                                <span>${item.title.replace('خلافة ', '').replace(' رضي الله عنه', '')}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- بطاقة ملخص العصر والرسوم التوضيحية التفاعلية -->
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/90 dark:border-slate-800 transition-colors">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <span class="px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 font-extrabold text-xs">
                                <i class="fa-solid ${era.icon} ml-1"></i> ${era.badge}
                            </span>
                            <span class="text-xs font-extrabold text-amber-800 dark:text-amber-300 bg-amber-100/80 dark:bg-amber-950/70 px-3 py-1 rounded-full border border-amber-300 dark:border-amber-800">
                                <i class="fa-regular fa-calendar ml-1"></i> ${era.period}
                            </span>
                        </div>
                        
                        <h2 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mb-2">${era.title}</h2>
                        <p class="text-slate-600 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${era.summary}</p>
                        
                        <!-- الرسم التوضيحي التفاعلي (SVG) -->
                        <div class="overflow-hidden rounded-2xl">
                            ${era.svgIllustration}
                        </div>
                    </div>

                    <!-- الخط الزمني للأحداث والغزوات والفتوحات مع بحث فوري -->
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/90 dark:border-slate-800 transition-colors">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                            <h3 class="font-black text-base sm:text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <i class="fa-solid fa-route text-emerald-600 dark:text-emerald-400"></i>
                                <span>أهم الأحداث والفتوحات (${filteredEvents.length})</span>
                            </h3>
                            <!-- أداة بحث تفاعلية داخل العصر -->
                            <div class="relative w-full sm:w-56">
                                <input id="eraSearchInput" type="text" value="${state.searchQuery}" oninput="handleSearchEvents(this.value)" placeholder="ابحث بتاريخ أو غزوة..." class="w-full pl-3 pr-9 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-950 text-xs font-bold outline-none transition">
                                <i class="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-slate-400 text-xs"></i>
                            </div>
                        </div>

                        <div class="relative border-r-2 border-emerald-300 dark:border-emerald-700 mr-3 space-y-4">
                            ${filteredEvents.length > 0 ? filteredEvents.map((ev, idx) => {
                                const eventKey = `${era.id}_${idx}`;
                                const isCollapsed = state.expandedEvents[eventKey] === false;
                                return `
                                    <div class="relative pr-6 fade-in-up" style="animation-delay: ${idx * 0.04}s">
                                        <!-- نقطة الخط الزمني -->
                                        <div class="absolute -right-[9px] top-3 w-4 h-4 rounded-full bg-emerald-600 border-4 border-emerald-100 dark:border-emerald-950 shadow-sm"></div>
                                        
                                        <div onclick="toggleEventDetail('${eventKey}')" class="interactive-card ripple-host bg-slate-50 dark:bg-slate-800/70 hover:bg-emerald-50/70 dark:hover:bg-slate-800 rounded-2xl p-4 border border-slate-200/70 dark:border-slate-700/80 cursor-pointer">
                                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                                <span class="inline-block text-xs font-black text-emerald-800 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-950 px-2.5 py-0.5 rounded-lg">
                                                    ${ev.date}
                                                </span>
                                                <i id="event-icon-${eventKey}" class="fa-solid fa-chevron-up text-slate-400 text-xs transition-transform duration-300 ${isCollapsed ? 'rotate-180' : ''}"></i>
                                            </div>
                                            <h4 class="font-extrabold text-sm sm:text-base text-slate-800 dark:text-slate-100">${ev.title}</h4>
                                            <div id="event-desc-${eventKey}" class="accordion-content ${isCollapsed ? 'collapsed' : ''}">
                                                <div class="accordion-inner">
                                                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed mt-1.5">${ev.desc}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('') : '<p class="text-center text-xs text-slate-400 py-6">لا توجد أحداث مطابقة لبحثك في هذا العصر.</p>'}
                        </div>

                        <!-- أزرار التنقل السريع بين العصور والأنشطة -->
                        <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap justify-between items-center gap-3">
                            <div class="flex items-center gap-2">
                                ${era.order > 1 ? `
                                    <button onclick="navigateTo('timeline', '${historicalEras[era.order - 2].id}')" class="ripple-host px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs flex items-center gap-1.5 transition active:scale-95">
                                        <i class="fa-solid fa-arrow-right"></i>
                                        <span>السابق</span>
                                    </button>
                                ` : ''}
                                ${era.order < historicalEras.length ? `
                                    <button onclick="navigateTo('timeline', '${historicalEras[era.order].id}')" class="ripple-host px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs flex items-center gap-2 transition active:scale-95">
                                        <span>التالي: ${historicalEras[era.order].title.replace('خلافة ', '').replace(' رضي الله عنه', '')}</span>
                                        <i class="fa-solid fa-arrow-left"></i>
                                    </button>
                                ` : ''}
                            </div>
                            <button onclick="navigateTo('activities')" class="shimmer-btn ripple-host px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-extrabold text-xs sm:text-sm flex items-center gap-2 shadow-md transition active:scale-95">
                                <i class="fa-solid fa-gamepad"></i>
                                <span>اختبر فهمك الآن</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // الشاشة 3: الأنشطة التفاعلية
        function renderActivities() {
            const act = activitiesBank[state.currentActivityIndex];
            const isCompleted = state.completedActivities.includes(act.id);

            let interactionHTML = '';

            // النمط 1: اختيار من متعدد
            if (act.type === 'mcq') {
                interactionHTML = `
                    <div class="space-y-3">
                        ${act.options.map((opt, idx) => `
                            <button onclick="checkMCQ(${idx})" class="interactive-card w-full text-right p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-emerald-500 dark:hover:border-emerald-500 hover:bg-emerald-50/60 dark:hover:bg-emerald-950/40 font-bold text-sm sm:text-base text-slate-700 dark:text-slate-200 flex items-center justify-between group">
                                <span>${opt}</span>
                                <span class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 group-hover:bg-emerald-600 group-hover:text-white flex items-center justify-center text-xs font-black text-slate-500 dark:text-slate-300 transition">
                                    ${['أ', 'ب', 'ج', 'د'][idx]}
                                </span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } 
            // النمط 2: الترتيب الزمني التفاعلي
            else if (act.type === 'ordering') {
                interactionHTML = `
                    <div class="space-y-4">
                        <div class="bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-2xl border-2 border-dashed border-emerald-300 dark:border-emerald-700 min-h-[130px]">
                            <p class="text-xs font-extrabold text-emerald-800 dark:text-emerald-300 mb-2.5 flex items-center gap-1.5">
                                <i class="fa-solid fa-arrow-down-1-9"></i>
                                <span>ترتيبك المختار (من الأقدم للأحدث):</span>
                            </p>
                            <div class="space-y-2">
                                ${state.tempOrderSelection.map((itemId, idx) => {
                                    const itemObj = act.items.find(i => i.id === itemId);
                                    return `
                                        <div class="fade-in-up flex items-center justify-between bg-emerald-100 dark:bg-emerald-950 text-emerald-950 dark:text-emerald-200 px-3.5 py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border border-emerald-200 dark:border-emerald-800">
                                            <span>${idx + 1}. ${itemObj.text}</span>
                                            <button onclick="removeOrderItem('${itemId}')" class="w-6 h-6 rounded-lg bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300 hover:bg-rose-600 hover:text-white flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
                                        </div>
                                    `;
                                }).join('')}
                                ${state.tempOrderSelection.length === 0 ? '<p class="text-xs text-slate-400 text-center py-5">اضغط على البطاقات بالأسفل لترتيبها هنا...</p>' : ''}
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            ${act.items.filter(i => !state.tempOrderSelection.includes(i.id)).map(item => `
                                <button onclick="selectOrderItem('${item.id}')" class="interactive-card p-3.5 rounded-2xl bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:border-amber-500 font-bold text-xs sm:text-sm text-slate-700 dark:text-slate-200 text-right flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 flex items-center justify-center shrink-0"><i class="fa-solid fa-plus text-xs"></i></span>
                                    <span>${item.text}</span>
                                </button>
                            `).join('')}
                        </div>

                        ${state.tempOrderSelection.length === act.items.length ? `
                            <button onclick="checkOrdering()" class="w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-600 text-white font-black text-sm shadow-lg pulse-btn transition active:scale-95">
                                <i class="fa-solid fa-check-double ml-1"></i> تحقق من الترتيب الزمني
                            </button>
                        ` : ''}
                    </div>
                `;
            }
            // النمط 3: التوصيل التفاعلي (Matching)
            else if (act.type === 'matching') {
                const shuffledRights = [...act.pairs].map(p => p.right).sort();
                interactionHTML = `
                    <div class="space-y-4">
                        <p class="text-xs text-amber-900 dark:text-amber-200 bg-amber-50 dark:bg-amber-950/60 p-3 rounded-2xl border border-amber-200 dark:border-amber-800 font-semibold">
                            <i class="fa-solid fa-hand-pointer text-amber-600 dark:text-amber-400 ml-1"></i>
                            اضغط على <strong>الإنجاز التاريخي</strong> أولاً، ثم اضغط على <strong>اسم الخليفة</strong> لربطهما معاً:
                        </p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- عمود الإنجازات -->
                            <div class="space-y-2">
                                <h4 class="text-xs font-black text-slate-500 dark:text-slate-400">1. الإنجاز التاريخي:</h4>
                                ${act.pairs.map(p => {
                                    const matchedRight = state.tempMatches[p.left];
                                    const isSelected = state.tempMatchLeft === p.left;
                                    return `
                                        <button onclick="selectMatchLeft('${p.left}')" class="interactive-card w-full p-3.5 rounded-2xl border-2 text-right text-xs sm:text-sm font-bold ${isSelected ? 'border-amber-500 bg-amber-50 dark:bg-amber-950/60 ring-2 ring-amber-200 dark:ring-amber-800 text-slate-900 dark:text-white' : matchedRight ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-200' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200'}">
                                            <div>${p.left}</div>
                                            ${matchedRight ? `<div class="text-[11px] text-emerald-700 dark:text-emerald-400 font-extrabold mt-1.5 flex items-center gap-1"><i class="fa-solid fa-link"></i> مرتبط بـ: ${matchedRight}</div>` : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>

                            <!-- عمود الخلفاء -->
                            <div class="space-y-2">
                                <h4 class="text-xs font-black text-slate-500 dark:text-slate-400">2. الخليفة الراشد:</h4>
                                ${shuffledRights.map(rightVal => `
                                    <button onclick="selectMatchRight('${rightVal}')" class="interactive-card w-full p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-emerald-500 bg-slate-50 dark:bg-slate-800/80 hover:bg-emerald-50/40 dark:hover:bg-emerald-950/40 text-right text-xs sm:text-sm font-extrabold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                                        <i class="fa-solid fa-user-check text-emerald-600 dark:text-emerald-400"></i>
                                        <span>${rightVal}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        ${Object.keys(state.tempMatches).length === act.pairs.length ? `
                            <button onclick="checkMatching()" class="w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-600 text-white font-black text-sm shadow-lg pulse-btn transition active:scale-95">
                                <i class="fa-solid fa-check-circle ml-1"></i> تأكيد التوصيل والتحقق
                            </button>
                        ` : ''}
                    </div>
                `;
            }
            // النمط 4: صح أم خطأ
            else if (act.type === 'truefalse') {
                interactionHTML = `
                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <button onclick="checkTrueFalse(true)" class="interactive-card p-6 rounded-3xl border-2 border-emerald-200 dark:border-emerald-800 bg-emerald-50/60 dark:bg-emerald-950/50 hover:bg-emerald-600 hover:text-white hover:border-emerald-600 text-emerald-800 dark:text-emerald-300 font-black text-base sm:text-lg flex flex-col items-center gap-2.5">
                            <i class="fa-solid fa-circle-check text-3xl"></i>
                            <span>عبارة صحيحة</span>
                        </button>
                        <button onclick="checkTrueFalse(false)" class="interactive-card p-6 rounded-3xl border-2 border-rose-200 dark:border-rose-800 bg-rose-50/60 dark:bg-rose-950/50 hover:bg-rose-600 hover:text-white hover:border-rose-600 text-rose-800 dark:text-rose-300 font-black text-base sm:text-lg flex flex-col items-center gap-2.5">
                            <i class="fa-solid fa-circle-xmark text-3xl"></i>
                            <span>عبارة خاطئة</span>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="fade-in-up space-y-5">
                    <div class="flex items-center gap-3 px-1">
                        <span class="font-black text-sm text-emerald-900 dark:text-emerald-300">${state.currentActivityIndex + 1} / ${activitiesBank.length}</span>
                        <div class="act-progress flex-1"><div style="width:${Math.round((state.completedActivities.length / activitiesBank.length) * 100)}%"></div></div>
                    </div>
                    <!-- شريط أرقام الأنشطة -->
                    <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
                        <div class="flex gap-1.5">
                            ${activitiesBank.map((a, idx) => {
                                const done = state.completedActivities.includes(a.id);
                                const active = idx === state.currentActivityIndex;
                                return `
                                    <button onclick="switchActivity(${idx})" class="w-9 h-9 rounded-xl font-black text-xs transition-all active:scale-90 ${active ? 'bg-emerald-800 dark:bg-emerald-700 text-white ring-2 ring-amber-400 scale-105' : done ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'}">
                                        ${done ? '<i class="fa-solid fa-check"></i>' : idx + 1}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <span class="text-xs font-extrabold text-emerald-800 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950 px-3 py-1 rounded-xl">نشاط ${state.currentActivityIndex + 1} / ${activitiesBank.length}</span>
                    </div>

                    <!-- بطاقة عرض الفكرة الرئيسية للنشاط -->
                    <div class="bg-gradient-to-l from-amber-50 to-orange-50 dark:from-amber-950/60 dark:to-slate-900 border-r-4 border-amber-500 rounded-2xl p-4 shadow-sm">
                        <div class="flex items-center gap-2 text-amber-800 dark:text-amber-300 font-black text-xs mb-1">
                            <i class="fa-solid fa-lightbulb text-amber-500 text-base"></i>
                            <span>تمهيد معرفي (${act.category})</span>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed font-bold">${act.mainIdea}</p>
                    </div>

                    <!-- بطاقة النشاط التفاعلي -->
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200 dark:border-slate-800 transition-colors">
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-extrabold text-xs">
                                نمط التفاعل: ${act.type === 'mcq' ? 'اختيار من متعدد' : act.type === 'ordering' ? 'ترتيب زمني' : act.type === 'matching' ? 'توصيل ومطابقة' : 'صواب أم خطأ'}
                            </span>
                            ${isCompleted ? '<span class="text-xs font-extrabold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950 px-2.5 py-1 rounded-full"><i class="fa-solid fa-circle-check"></i> مُنجز</span>' : ''}
                        </div>

                        <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white mb-5 leading-relaxed">
                            ${act.question}
                        </h3>

                        ${interactionHTML}
                    </div>
                </div>
            `;
        }

        // --- 7. منطق التحقق والتغذية الراجعة التربوية ---
        function switchActivity(idx) {
            playSound('click');
            state.currentActivityIndex = idx;
            state.tempOrderSelection = [];
            state.tempMatchLeft = null;
            state.tempMatches = {};
            render(true);
        }

        function checkMCQ(selectedIdx) {
            const act = activitiesBank[state.currentActivityIndex];
            showPedagogicalFeedback(selectedIdx === act.correctIndex, act);
        }

        function selectOrderItem(id) {
            playSound('pop');
            if (!state.tempOrderSelection.includes(id)) {
                state.tempOrderSelection.push(id);
                render();
            }
        }
        function removeOrderItem(id) {
            playSound('click');
            state.tempOrderSelection = state.tempOrderSelection.filter(i => i !== id);
            render();
        }
        function checkOrdering() {
            const act = activitiesBank[state.currentActivityIndex];
            const isCorrect = JSON.stringify(state.tempOrderSelection) === JSON.stringify(act.correctOrder);
            showPedagogicalFeedback(isCorrect, act);
        }

        function selectMatchLeft(leftText) {
            playSound('pop');
            state.tempMatchLeft = leftText;
            render();
        }
        function selectMatchRight(rightText) {
            playSound('pop');
            if (!state.tempMatchLeft) {
                const act = activitiesBank[state.currentActivityIndex];
                const unlinked = act.pairs.find(p => !state.tempMatches[p.left]);
                if (unlinked) state.tempMatchLeft = unlinked.left;
            }
            if (state.tempMatchLeft) {
                state.tempMatches[state.tempMatchLeft] = rightText;
                state.tempMatchLeft = null;
                render();
            }
        }
        function checkMatching() {
            const act = activitiesBank[state.currentActivityIndex];
            const isCorrect = act.pairs.every(p => state.tempMatches[p.left] === p.right);
            showPedagogicalFeedback(isCorrect, act);
        }

        function checkTrueFalse(userAns) {
            const act = activitiesBank[state.currentActivityIndex];
            showPedagogicalFeedback(userAns === act.correctAnswer, act);
        }

        // إطلاق قصاصات احتفالية ذهبية وخضراء عند الإجابة الصحيحة
        function triggerCelebrationBurst() {
            const colors = ['#fbbf24', '#10b981', '#34d399', '#f59e0b', '#fde68a'];
            for (let i = 0; i < 28; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[i % colors.length];
                piece.style.left = '50%';
                piece.style.top = '45%';
                const angle = (Math.PI * 2 * i) / 28 + (Math.random() * 0.3);
                const distance = 90 + Math.random() * 140;
                piece.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                piece.style.setProperty('--ty', `${Math.sin(angle) * distance - 40}px`);
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 1150);
            }
        }

        function showPedagogicalFeedback(isCorrect, act) {
            const modal = document.getElementById('feedbackModal');
            const card = document.getElementById('feedbackCard');
            const iconContainer = document.getElementById('feedbackIconContainer');
            const title = document.getElementById('feedbackTitle');
            const message = document.getElementById('feedbackMessage');
            const pedBox = document.getElementById('pedagogicalBox');
            const pedBadge = document.getElementById('pedagogicalBadge');
            const pedText = document.getElementById('pedagogicalText');
            const actions = document.getElementById('feedbackActions');

            if (isCorrect) {
                playSound('success');
                triggerCelebrationBurst();
                if (!state.completedActivities.includes(act.id)) {
                    state.completedActivities.push(act.id);
                    updateProgress();
                }

                iconContainer.className = 'w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-white flex items-center justify-center text-3xl mb-4 shadow-lg';
                iconContainer.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                title.className = 'text-2xl font-black mb-1 text-emerald-800 dark:text-emerald-300';
                title.textContent = 'أحسنت! استجابة صحيحة';
                message.textContent = 'تعزيز إيجابي: إجابتك دقيقة وتدل على فهم ممتاز للتسلسل التاريخي.';

                pedBox.className = 'rounded-2xl p-4 mb-6 border bg-emerald-50 dark:bg-emerald-950/70 border-emerald-200 dark:border-emerald-800 text-right';
                pedBadge.className = 'flex items-center gap-2 font-black text-sm mb-1.5 text-emerald-800 dark:text-emerald-300';
                pedBadge.innerHTML = '<i class="fa-solid fa-star text-amber-500"></i> <span>معلومة إثرائية:</span>';
                pedText.className = 'text-xs sm:text-sm leading-relaxed text-emerald-950 dark:text-emerald-100 font-semibold';
                pedText.textContent = act.enrichment;

                const hasNext = state.currentActivityIndex < activitiesBank.length - 1;
                actions.innerHTML = `
                    <button onclick="closeModal(${hasNext})" class="shimmer-btn w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-600 text-white font-black text-sm shadow-lg transition active:scale-95">
                        ${hasNext ? 'الانتقال للنشاط التالي <i class="fa-solid fa-arrow-left mr-1"></i>' : 'إتمام جميع الأنشطة بنجاح <i class="fa-solid fa-check mr-1"></i>'}
                    </button>
                `;
            } else {
                playSound('error');
                iconContainer.className = 'w-16 h-16 rounded-2xl bg-gradient-to-br from-rose-500 to-rose-600 text-white flex items-center justify-center text-3xl mb-4 shadow-lg';
                iconContainer.innerHTML = '<i class="fa-solid fa-rotate-left"></i>';
                title.className = 'text-2xl font-black mb-1 text-rose-700 dark:text-rose-400';
                title.textContent = 'حاول مرة أخرى!';
                message.textContent = 'استجابة غير صحيحة: اقرأ المعلومة العلاجية بالأسفل ثم أعد المحاولة.';

                pedBox.className = 'rounded-2xl p-4 mb-6 border bg-amber-50 dark:bg-amber-950/60 border-amber-300 dark:border-amber-800 text-right';
                pedBadge.className = 'flex items-center gap-2 font-black text-sm mb-1.5 text-amber-900 dark:text-amber-300';
                pedBadge.innerHTML = '<i class="fa-solid fa-book-medical text-amber-600 dark:text-amber-400"></i> <span>معلومة تفسيرية علاجية:</span>';
                pedText.className = 'text-xs sm:text-sm leading-relaxed text-slate-800 dark:text-slate-200 font-semibold';
                pedText.textContent = act.remedial;

                actions.innerHTML = `
                    <button onclick="retryActivity()" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-emerald-950 font-black text-sm shadow-lg transition active:scale-95">
                        <i class="fa-solid fa-rotate-right ml-1"></i> إعادة حل النشاط مرة أخرى
                    </button>
                `;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                card.classList.remove('scale-90', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 20);
        }

        function retryActivity() {
            state.tempOrderSelection = [];
            state.tempMatchLeft = null;
            state.tempMatches = {};
            closeModal(false);
            render();
        }

        function closeModal(goNext) {
            const modal = document.getElementById('feedbackModal');
            const card = document.getElementById('feedbackCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-90', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                if (goNext && state.currentActivityIndex < activitiesBank.length - 1) {
                    switchActivity(state.currentActivityIndex + 1);
                } else {
                    render();
                }
            }, 220);
        }

        // إضافة تأثير تموج اللمس (Ripple) على الأزرار التفاعلية
        document.addEventListener('pointerdown', function(e) {
            const host = e.target.closest('.ripple-host, .interactive-card');
            if (!host) return;
            const rect = host.getBoundingClientRect();
            const circle = document.createElement('span');
            const diameter = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - diameter / 2}px`;
            circle.style.top = `${e.clientY - rect.top - diameter / 2}px`;
            circle.classList.add('ripple-circle');
            host.appendChild(circle);
            setTimeout(() => circle.remove(), 550);
        });

        // دعم السحب الأفقي (Swipe) للتنقل السلس بين التبويبات الرئيسية على الموبايل
        let touchStartX = 0;
        let touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            if (e.target.closest('.no-scrollbar')) return; // تجاهل السحب داخل شريط العصور الأفقي
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (e.target.closest('.no-scrollbar')) return;
            const modal = document.getElementById('feedbackModal');
            if (modal && !modal.classList.contains('hidden')) return;

            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(deltaX) > 85 && Math.abs(deltaX) > Math.abs(deltaY) * 1.8) {
                const viewsOrder = ['home', 'timeline', 'activities'];
                const currentIdx = viewsOrder.indexOf(state.currentView);
                // مراعاة اتجاه RTL العربي
                if (deltaX > 0 && currentIdx < viewsOrder.length - 1) {
                    navigateTo(viewsOrder[currentIdx + 1]);
                } else if (deltaX < 0 && currentIdx > 0) {
                    navigateTo(viewsOrder[currentIdx - 1]);
                }
            }
        }, { passive: true });

        // تشغيل شاشة البداية المتحركة ثم عرض التطبيق
        window.onload = function() {
            initDarkMode();
            render(true);
            const loader = document.getElementById('splashLoader');
            const splash = document.getElementById('splashScreen');
            
            setTimeout(() => { if (loader) loader.style.width = '65%'; }, 250);
            setTimeout(() => { if (loader) loader.style.width = '100%'; }, 650);
            setTimeout(() => {
                if (splash) {
                    splash.classList.add('splash-hide');
                    setTimeout(() => { splash.style.display = 'none'; }, 700);
                }
            }, 1150);
        };
    </script>
</body>
</html>
